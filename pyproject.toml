[project]
name = "patricle_counting"
version = "0.0.0"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
    "matplotlib",
    "nd2",
    "nd2reader",
    "toml",
] # add specific versions here
requires-python = ">=3.12"
authors = [
  {name = "Paul Aguirre", email = "aguirre.paul6200@gmail.com"},
]
maintainers = [
  {name = "François Truong", email = "francois.truong@univ-grenoble-alpes.fr"}
]
# description = "Lovely Spam! Wonderful Spam!"
readme = {file="README.md", content-type = "text/markdown"}
# license = {file = "LICENSE.txt"}
keywords = ["microscopy","confocal microscopy", "particle counting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Framework :: Matplotlib",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Visualization",
]

